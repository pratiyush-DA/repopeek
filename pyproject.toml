[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repopeek"
version = "0.1.0"
description = "Repository Intelligence Engine and Semantic Code Property Graph for Agentic Workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "pratiyush-DA" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]
dependencies = [
    "networkx>=3.0",
    "sqlglot>=25.0.0",
    "sqlparse>=0.5.0",
    "jsonschema>=4.20.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
repopeek = "repopeek.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repopeek*"]

