<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepoPeek — Code Intelligence Graph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0e15;
      --panel-bg: rgba(20, 22, 33, 0.90);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.18);
      --border-active: rgba(122, 162, 247, 0.5);
      --text: #c0caf5;
      --text-muted: #7982a9;
      --accent: #7aa2f7;
      --accent-glow: rgba(122, 162, 247, 0.35);
      --color-module: #38bdf8;
      --color-class: #a855f7;
      --color-function: #10b981;
      --color-entity: #f59e0b;
      --color-config: #f43f5e;
      --color-symbol: #94a3b8;
      --color-impact: #ff0055;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* Top Bar Controls */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .divider {
      width: 1px;
      height: 20px;
      background: var(--border);
    }

    select, input {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .btn-icon {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      border-color: var(--border-hover);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .stats-badge {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Forces Control Dropdown */
    .forces-panel {
      position: absolute;
      top: 65px;
      left: 16px;
      z-index: 15;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      width: 260px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .forces-panel.open {
      display: flex;
    }

    .control-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .control-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      outline: none;
      padding: 0;
      border: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 6px var(--accent);
    }

    /* Floating Legend */
    .legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      display: flex;
      gap: 14px;
      font-size: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* Right Inspector Drawer */
    .inspector {
      position: absolute;
      top: 16px;
      right: 16px;
      bottom: 16px;
      width: 380px;
      background: var(--panel-bg);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: -8px 0 36px rgba(0, 0, 0, 0.6);
      transform: translateX(420px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
    }

    .inspector.open {
      transform: translateX(0);
    }

    .inspector-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .inspector-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      word-break: break-all;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .close-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .story-card {
      background: rgba(0, 0, 0, 0.35);
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.4;
      font-style: italic;
    }

    .facts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .fact-item {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
    }

    .fact-val {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      font-family: monospace;
    }

    .fact-key {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .action-btn {
      background: var(--accent);
      color: #0f1017;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
    }

    .action-btn:hover {
      filter: brightness(1.15);
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .action-btn.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .action-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Tooltip */
    #tooltip {
      position: absolute;
      z-index: 30;
      background: rgba(15, 16, 23, 0.95);
      border: 1px solid var(--border-active);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      pointer-events: none;
      display: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transform: translate(-50%, -125%);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="graph-canvas"></canvas>
  </div>

  <div class="top-bar">
    <div class="brand">
      <div class="brand-dot"></div>
      RepoPeek
    </div>
    <div class="divider"></div>
    <select id="lens-select">
      <option value="call">Lens: Call Graph</option>
      <option value="module">Lens: Module Tree</option>
      <option value="class">Lens: Class Hierarchy</option>
      <option value="data">Lens: Data Flow (Def-Use)</option>
      <option value="data_entity">Lens: Data Entities (SQL)</option>
      <option value="config">Lens: Config & Env</option>
      <option value="process">Lens: Process Flows</option>
      <option value="exception">Lens: Exceptions</option>
      <option value="symbol">Lens: Symbol Graph</option>
      <option value="all">Full Canonical Graph</option>
    </select>
    <input type="text" id="search-input" placeholder="Search symbols or files..." />
    <button class="btn-icon" id="toggle-forces" title="Adjust Graph Physics">Forces ⚙</button>
    <button class="btn-icon" id="btn-recenter" title="Recenter View">Reset ⌂</button>
    <div class="divider"></div>
    <div class="stats-badge" id="stats-badge">Loading graph...</div>
  </div>

  <!-- Forces Physics Settings Panel -->
  <div class="forces-panel" id="forces-panel">
    <div style="font-weight: 600; font-size: 12px; color: #fff; margin-bottom: 4px;">Graph Forces & Physics</div>
    <div class="control-row">
      <div class="control-label"><span>Repel Strength</span><span id="lbl-repel">-120</span></div>
      <input type="range" id="slider-repel" min="-400" max="-20" value="-120" />
    </div>
    <div class="control-row">
      <div class="control-label"><span>Link Distance</span><span id="lbl-distance">55</span></div>
      <input type="range" id="slider-distance" min="20" max="150" value="55" />
    </div>
    <div class="control-row">
      <div class="control-label"><span>Center Gravity</span><span id="lbl-center">0.3</span></div>
      <input type="range" id="slider-center" min="0.05" max="1" step="0.05" value="0.3" />
    </div>
    <div class="control-row">
      <label style="font-size: 12px; display: flex; align-items: center; gap: 6px; cursor: pointer; margin-top: 4px;">
        <input type="checkbox" id="chk-labels" checked /> Show Node Labels
      </label>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background: var(--color-module)"></div> Module</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--color-class)"></div> Class</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--color-function)"></div> Function</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--color-entity)"></div> Entity/Table</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--color-config)"></div> Config</div>
  </div>

  <div id="tooltip"></div>

  <!-- Inspector Panel -->
  <div class="inspector" id="inspector">
    <div class="inspector-header">
      <div>
        <div class="inspector-title" id="node-title">Node Title</div>
        <div class="badge" id="node-kind-badge">function</div>
      </div>
      <button class="close-btn" id="close-inspector">&times;</button>
    </div>

    <div class="section">
      <div class="section-label">Source Span</div>
      <div style="font-family: monospace; font-size: 12px; color: var(--accent)" id="node-span">file.py:1-10</div>
    </div>

    <div class="section">
      <div class="section-label">Semantic Story</div>
      <div class="story-card" id="node-story">Generating story...</div>
    </div>

    <div class="section">
      <div class="section-label">AST Facts</div>
      <div class="facts-grid">
        <div class="fact-item">
          <div class="fact-val" id="fact-calls">0</div>
          <div class="fact-key">Calls</div>
        </div>
        <div class="fact-item">
          <div class="fact-val" id="fact-complexity">1</div>
          <div class="fact-key">Complexity</div>
        </div>
        <div class="fact-item">
          <div class="fact-val" id="fact-reads">0</div>
          <div class="fact-key">Reads</div>
        </div>
        <div class="fact-item">
          <div class="fact-val" id="fact-writes">0</div>
          <div class="fact-key">Writes</div>
        </div>
      </div>
    </div>

    <div class="section" style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
      <button class="action-btn" id="impact-btn">Analyze Blast Radius</button>
      <button class="action-btn secondary" id="copy-pack-btn">Copy Context Pack</button>
    </div>
  </div>

  <script>
    // State
    let rawNodes = [];
    let rawEdges = [];
    let nodes = [];
    let edges = [];
    let nodeMap = new Map();
    let selectedNode = null;
    let hoveredNode = null;
    let impactHighlight = null;

    // Physics parameters
    let repelStrength = -120;
    let linkDistance = 55;
    let centerGravity = 0.3;
    let showLabels = true;

    // Viewport transform
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let isDraggingCanvas = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let draggedNode = null;

    // Alpha cooling schedule
    let alpha = 1.0;
    const alphaDecay = 0.022; // Cools in ~120 frames (~2 seconds)
    const alphaMin = 0.002;
    let isSimulating = false;

    const canvas = document.getElementById("graph-canvas");
    const ctx = canvas.getContext("2d");
    const tooltip = document.getElementById("tooltip");
    const inspector = document.getElementById("inspector");
    const lensSelect = document.getElementById("lens-select");
    const searchInput = document.getElementById("search-input");
    const statsBadge = document.getElementById("stats-badge");
    const forcesPanel = document.getElementById("forces-panel");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (offsetX === 0 && offsetY === 0) {
        offsetX = canvas.width / 2;
        offsetY = canvas.height / 2;
      }
      draw();
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function formatNodeLabel(n) {
      const id = n.id || "";
      const kind = (n.kind || "").toLowerCase();
      const qual = id.includes("::") ? id.split("::").pop() : id;
      if (qual === "<module>" || qual === "<config>" || qual === "<script>") {
        const file = (n.span && n.span.file) ? n.span.file.split("/").pop() : qual;
        return "module " + file;
      }
      if (kind === "function" || kind === "method") return kind + " " + qual + "()";
      if (kind === "class") return "class " + qual;
      return qual;
    }

    function getNodeColor(kind) {
      kind = (kind || "").toLowerCase();
      if (kind === "module" || kind === "file") return "#38bdf8";
      if (kind === "class" || kind === "interface") return "#a855f7";
      if (kind === "function" || kind === "method") return "#10b981";
      if (kind.includes("table") || kind.includes("entity")) return "#f59e0b";
      if (kind.includes("config") || kind.includes("yaml") || kind.includes("json")) return "#f43f5e";
      return "#94a3b8";
    }

    async function loadLens(lensName) {
      statsBadge.innerText = "Loading " + lensName + "...";
      try {
        const res = await fetch("/api/graph?lens=" + lensName);
        const data = await res.json();
        rawNodes = data.nodes || [];
        rawEdges = data.edges || [];

        // Build node objects arranged in gentle phyllotaxis sunflower spiral
        nodeMap.clear();
        const c = 22;
        nodes = rawNodes.map((n, i) => {
          const r = c * Math.sqrt(i + 1);
          const theta = i * 2.399963229728653; // Golden angle
          const node = {
            ...n,
            x: Math.cos(theta) * r,
            y: Math.sin(theta) * r,
            vx: 0,
            vy: 0,
            radius: n.kind === "module" ? 9 : (n.kind === "class" ? 7 : 5),
          };
          nodeMap.set(n.id, node);
          return node;
        });

        // Resolve edge src/dst objects directly
        edges = [];
        rawEdges.forEach(e => {
          const s = nodeMap.get(e.src);
          const t = nodeMap.get(e.dst);
          if (s && t) {
            edges.push({
              src: e.src,
              dst: e.dst,
              source: s,
              target: t,
              type: e.type,
            });
          }
        });

        statsBadge.innerText = `${nodes.length.toLocaleString()} nodes · ${edges.length.toLocaleString()} edges`;
        impactHighlight = null;

        // Start force simulation
        startSimulation(1.0);
      } catch (err) {
        statsBadge.innerText = "Failed to load: " + err.message;
      }
    }

    function startSimulation(initAlpha = 1.0) {
      alpha = initAlpha;
      if (!isSimulating) {
        isSimulating = true;
        requestAnimationFrame(tickSimulation);
      }
    }

    // Alpha-cooled force simulation with velocity damping and collision separation
    function tickSimulation() {
      if (alpha < alphaMin) {
        isSimulating = false;
        draw();
        return;
      }

      const count = nodes.length;
      const kRepel = Math.abs(repelStrength) * 14 * alpha;
      const kLink = 0.08 * alpha;
      const epsilon = 120; // Softening factor avoids divide-by-zero
      const velocityDamping = 0.65; // 35% velocity decay per frame kills vibration

      // 1. Center gravity
      for (let i = 0; i < count; i++) {
        const n = nodes[i];
        if (n === draggedNode) continue;
        n.vx -= n.x * 0.006 * centerGravity * alpha;
        n.vy -= n.y * 0.006 * centerGravity * alpha;
      }

      // 2. Pairwise repulsion
      for (let i = 0; i < count; i++) {
        const n1 = nodes[i];
        for (let j = i + 1; j < count; j++) {
          const n2 = nodes[j];
          const dx = n2.x - n1.x;
          const dy = n2.y - n1.y;
          const distSq = dx * dx + dy * dy + epsilon;
          if (distSq < 160000) { // Interaction cutoff 400px
            const dist = Math.sqrt(distSq);
            const force = kRepel / distSq;
            const fx = (dx / dist) * force;
            const fy = (dy / dist) * force;
            if (n1 !== draggedNode) { n1.vx -= fx; n1.vy -= fy; }
            if (n2 !== draggedNode) { n2.vx += fx; n2.vy += fy; }
          }
        }
      }

      // 3. Link spring attraction
      for (let i = 0; i < edges.length; i++) {
        const e = edges[i];
        const s = e.source;
        const t = e.target;
        const dx = t.x - s.x;
        const dy = t.y - s.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const displacement = dist - linkDistance;
        const force = displacement * kLink;
        const fx = (dx / dist) * force;
        const fy = (dy / dist) * force;

        if (s !== draggedNode) { s.vx += fx; s.vy += fy; }
        if (t !== draggedNode) { t.vx -= fx; t.vy -= fy; }
      }

      // 4. Collision separation (prevent node overlap)
      for (let i = 0; i < count; i++) {
        const n1 = nodes[i];
        for (let j = i + 1; j < count; j++) {
          const n2 = nodes[j];
          const dx = n2.x - n1.x;
          const dy = n2.y - n1.y;
          const minDist = n1.radius + n2.radius + 6;
          const distSq = dx * dx + dy * dy;
          if (distSq < minDist * minDist && distSq > 0.01) {
            const dist = Math.sqrt(distSq);
            const overlap = (minDist - dist) * 0.4 * alpha;
            const ox = (dx / dist) * overlap;
            const oy = (dy / dist) * overlap;
            if (n1 !== draggedNode) { n1.x -= ox; n1.y -= oy; }
            if (n2 !== draggedNode) { n2.x += ox; n2.y += oy; }
          }
        }
      }

      // 5. Update positions with velocity clamps
      for (let i = 0; i < count; i++) {
        const n = nodes[i];
        if (n === draggedNode) continue;
        n.vx = Math.max(-10, Math.min(10, n.vx * velocityDamping));
        n.vy = Math.max(-10, Math.min(10, n.vy * velocityDamping));
        n.x += n.vx;
        n.y += n.vy;
      }

      // 6. Decay alpha
      alpha *= (1 - alphaDecay);

      draw();
      requestAnimationFrame(tickSimulation);
    }

    // Canvas drawing
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);

      // Draw edges
      for (let i = 0; i < edges.length; i++) {
        const e = edges[i];
        const s = e.source;
        const t = e.target;
        if (!s || !t) continue;

        const inImpact = impactHighlight && impactHighlight.has(e.src) && impactHighlight.has(e.dst);
        const inHover = hoveredNode && (e.src === hoveredNode.id || e.dst === hoveredNode.id);

        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(t.x, t.y);

        if (inImpact) {
          ctx.strokeStyle = "#ff0055";
          ctx.lineWidth = 2.2;
        } else if (inHover) {
          ctx.strokeStyle = "#7aa2f7";
          ctx.lineWidth = 1.6;
        } else {
          ctx.strokeStyle = "rgba(255, 255, 255, 0.09)";
          ctx.lineWidth = 0.8;
        }
        ctx.stroke();
      }

      // Draw nodes
      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];
        const isSelected = selectedNode && selectedNode.id === n.id;
        const isHovered = hoveredNode && hoveredNode.id === n.id;
        const inImpact = impactHighlight && impactHighlight.has(n.id);

        let color = getNodeColor(n.kind);
        if (inImpact) color = "#ff0055";

        // Aura for selected / impact
        if (isSelected || inImpact) {
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.radius + 6, 0, Math.PI * 2);
          ctx.fillStyle = inImpact ? "rgba(255, 0, 85, 0.25)" : "rgba(122, 162, 247, 0.3)";
          ctx.fill();
        }

        // Node body
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();

        if (isSelected || inImpact || isHovered) {
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 1.8;
          ctx.stroke();
        }

        // Labels — scale with zoom; prefer server-provided developer labels
        if (showLabels && (scale > 0.85 || isHovered || isSelected || inImpact)) {
          const px = Math.max(10, Math.min(18, 9 + scale * 4));
          ctx.font = `${isSelected || isHovered ? 600 : 500} ${px}px "IBM Plex Sans", "Segoe UI", sans-serif`;
          ctx.fillStyle = isHovered || isSelected ? "#ffffff" : "rgba(224, 230, 255, 0.88)";
          const raw = n.label || formatNodeLabel(n);
          const label = raw.length > 48 ? raw.slice(0, 45) + "…" : raw;
          ctx.fillText(label, n.x + n.radius + 4, n.y + 3);
        }
      }

      ctx.restore();
    }

    // Hit test
    function findNodeAt(clientX, clientY) {
      const worldX = (clientX - offsetX) / scale;
      const worldY = (clientY - offsetY) / scale;

      for (let i = nodes.length - 1; i >= 0; i--) {
        const n = nodes[i];
        const dx = worldX - n.x;
        const dy = worldY - n.y;
        if (dx * dx + dy * dy <= (n.radius + 6) * (n.radius + 6)) {
          return n;
        }
      }
      return null;
    }

    // Interactions
    canvas.addEventListener("mousedown", e => {
      const node = findNodeAt(e.clientX, e.clientY);
      if (node) {
        draggedNode = node;
        startSimulation(0.25);
      } else {
        isDraggingCanvas = true;
        dragStartX = e.clientX - offsetX;
        dragStartY = e.clientY - offsetY;
      }
    });

    window.addEventListener("mousemove", e => {
      if (draggedNode) {
        const worldX = (e.clientX - offsetX) / scale;
        const worldY = (e.clientY - offsetY) / scale;
        draggedNode.x = worldX;
        draggedNode.y = worldY;
        draggedNode.vx = 0;
        draggedNode.vy = 0;
        startSimulation(0.12);
        return;
      }

      if (isDraggingCanvas) {
        offsetX = e.clientX - dragStartX;
        offsetY = e.clientY - dragStartY;
        draw();
        return;
      }

      const node = findNodeAt(e.clientX, e.clientY);
      if (node !== hoveredNode) {
        hoveredNode = node;
        if (node) {
          tooltip.style.display = "block";
          tooltip.style.left = e.clientX + "px";
          tooltip.style.top = e.clientY + "px";
          const shortName = node.label || formatNodeLabel(node);
          tooltip.innerText = `${shortName} (${node.kind})`;
        } else {
          tooltip.style.display = "none";
        }
        draw();
      }
    });

    window.addEventListener("mouseup", () => {
      if (draggedNode) {
        draggedNode = null;
        startSimulation(0.2);
      }
      isDraggingCanvas = false;
    });

    canvas.addEventListener("wheel", e => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.12 : 0.88;
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      offsetX = mouseX - (mouseX - offsetX) * zoomFactor;
      offsetY = mouseY - (mouseY - offsetY) * zoomFactor;
      scale *= zoomFactor;
      scale = Math.max(0.1, Math.min(8, scale));
      draw();
    });

    canvas.addEventListener("click", e => {
      const node = findNodeAt(e.clientX, e.clientY);
      if (node) {
        selectNode(node);
      }
    });

    function selectNode(node) {
      selectedNode = node;
      document.getElementById("node-title").innerText = node.id.split("::").pop();
      const kindBadge = document.getElementById("node-kind-badge");
      kindBadge.innerText = node.kind;
      kindBadge.style.backgroundColor = getNodeColor(node.kind);
      kindBadge.style.color = "#000";

      const spanText = node.span && node.span.file ? `${node.span.file}:${node.span.start}-${node.span.end}` : "External / Generated";
      document.getElementById("node-span").innerText = spanText;

      const story = node.story && node.story.text ? node.story.text : "No story generated yet.";
      document.getElementById("node-story").innerText = story;

      const facts = node.facts || {};
      document.getElementById("fact-calls").innerText = facts.calls || 0;
      document.getElementById("fact-complexity").innerText = facts.complexity || 1;
      document.getElementById("fact-reads").innerText = (facts.reads || []).length;
      document.getElementById("fact-writes").innerText = (facts.writes || []).length;

      inspector.classList.add("open");
      draw();
    }

    document.getElementById("close-inspector").addEventListener("click", () => {
      inspector.classList.remove("open");
      selectedNode = null;
      impactHighlight = null;
      draw();
    });

    document.getElementById("impact-btn").addEventListener("click", async () => {
      if (!selectedNode) return;
      const btn = document.getElementById("impact-btn");
      btn.innerText = "Analyzing...";
      try {
        const res = await fetch(`/api/impact?target=${encodeURIComponent(selectedNode.id)}`);
        const data = await res.json();
        const affected = new Set();
        affected.add(selectedNode.id);
        (data.affected_nodes || []).forEach(n => affected.add(n.id));
        impactHighlight = affected;
        btn.innerText = `Blast Radius (${affected.size} nodes)`;
        draw();
      } catch (err) {
        btn.innerText = "Error analyzing impact";
      }
    });

    document.getElementById("copy-pack-btn").addEventListener("click", async () => {
      if (!selectedNode) return;
      try {
        const res = await fetch(`/api/pack?target=${encodeURIComponent(selectedNode.id)}`);
        const text = await res.text();
        await navigator.clipboard.writeText(text);
        const btn = document.getElementById("copy-pack-btn");
        btn.innerText = "Copied to Clipboard!";
        setTimeout(() => btn.innerText = "Copy Context Pack", 2000);
      } catch (err) {
        alert("Failed to copy pack: " + err.message);
      }
    });

    lensSelect.addEventListener("change", e => {
      loadLens(e.target.value);
    });

    searchInput.addEventListener("input", e => {
      const term = e.target.value.toLowerCase().trim();
      if (!term) return;
      const match = nodes.find(n => n.id.toLowerCase().includes(term));
      if (match) {
        offsetX = canvas.width / 2 - match.x * scale;
        offsetY = canvas.height / 2 - match.y * scale;
        selectNode(match);
      }
    });

    // Forces Settings Panel
    document.getElementById("toggle-forces").addEventListener("click", () => {
      forcesPanel.classList.toggle("open");
    });

    document.getElementById("slider-repel").addEventListener("input", e => {
      repelStrength = parseInt(e.target.value);
      document.getElementById("lbl-repel").innerText = repelStrength;
      startSimulation(0.3);
    });

    document.getElementById("slider-distance").addEventListener("input", e => {
      linkDistance = parseInt(e.target.value);
      document.getElementById("lbl-distance").innerText = linkDistance;
      startSimulation(0.3);
    });

    document.getElementById("slider-center").addEventListener("input", e => {
      centerGravity = parseFloat(e.target.value);
      document.getElementById("lbl-center").innerText = centerGravity;
      startSimulation(0.3);
    });

    document.getElementById("chk-labels").addEventListener("change", e => {
      showLabels = e.target.checked;
      draw();
    });

    document.getElementById("btn-recenter").addEventListener("click", () => {
      scale = 1;
      offsetX = canvas.width / 2;
      offsetY = canvas.height / 2;
      draw();
    });

    // Start
    loadLens("call");
  </script>
</body>
</html>
